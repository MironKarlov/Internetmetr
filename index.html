<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интернетометр</title>

<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:linear-gradient(135deg,#0f172a,#1e293b);
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .card{
        background:#111827;
        padding:30px;
        border-radius:20px;
        width:320px;
        text-align:center;
        box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    h1{
        margin-bottom:20px;
    }

    .speed{
        font-size:55px;
        font-weight:bold;
        margin:20px 0;
    }

    .status{
        font-size:28px;
        font-weight:bold;
        padding:10px;
        border-radius:12px;
    }

    .bad{
        background:#dc2626;
    }

    .good{
        background:#f59e0b;
    }

    .excellent{
        background:#16a34a;
    }

    button{
        margin-top:20px;
        padding:12px 20px;
        border:none;
        border-radius:12px;
        background:#2563eb;
        color:white;
        font-size:18px;
        cursor:pointer;
    }

    button:hover{
        background:#1d4ed8;
    }

    .info{
        margin-top:15px;
        color:#cbd5e1;
    }
</style>
</head>
<body>

<div class="card">
    <h1>📶 Интернетометр</h1>

    <div class="speed" id="speed">0 Mbps</div>

    <div class="status bad" id="status">Нет данных</div>

    <div class="info" id="connectionType">
        Тип сети: неизвестно
    </div>

    <button onclick="testSpeed()">Проверить</button>
</div>

<script>
async function testSpeed(){

    const speedElement = document.getElementById("speed");
    const statusElement = document.getElementById("status");
    const connectionType = document.getElementById("connectionType");

    // Определение типа подключения
    let type = "Неизвестно";

    if(navigator.connection){
        type = navigator.connection.effectiveType || "Неизвестно";
    }

    connectionType.innerHTML = "Тип сети: " + type;

    speedElement.innerHTML = "Тест...";

    // Тест скорости
    const imageAddr = "https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg";
    const downloadSize = 14651500;

    let startTime, endTime;

    const cacheBuster = "?nnn=" + Math.random();

    const download = new Image();

    startTime = new Date().getTime();

    download.onload = function(){
        endTime = new Date().getTime();

        const duration = (endTime - startTime) / 1000;

        const bitsLoaded = downloadSize * 8;

        const speedMbps = ((bitsLoaded / duration) / 1024 / 1024).toFixed(2);

        speedElement.innerHTML = speedMbps + " Mbps";

        // Оценка качества
        if(speedMbps < 5){
            statusElement.innerHTML = "Плохой";
            statusElement.className = "status bad";
        }
        else if(speedMbps < 30){
            statusElement.innerHTML = "Хороший";
            statusElement.className = "status good";
        }
        else{
            statusElement.innerHTML = "Отличный";
            statusElement.className = "status excellent";
        }
    };

    download.src = imageAddr + cacheBuster;
}
</script>

</body>
</html>
